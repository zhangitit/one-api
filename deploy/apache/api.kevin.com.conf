<VirtualHost *:80>
    ServerName api.kevin.com

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3101/ connectiontimeout=5 timeout=300 retry=0
    ProxyPassReverse / http://127.0.0.1:3101/

    RequestHeader set X-Forwarded-Proto "http"
    ErrorLog "/private/var/log/apache2/api.kevin.com-error_log"
    CustomLog "/private/var/log/apache2/api.kevin.com-access_log" common
</VirtualHost>
