# ZeoNexus: stack.zeotrue.com -> inference Gateway.
# Paste into this site's custom configuration INSIDE its existing server block.
# Keep the site's certificate and ACME settings; replace older ZeoNexus custom rules.
if ($uri !~ "^/(v1/|healthz$|readyz$|[.]well-known/)") { return 404; }

location = /healthz {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Upgrade "";
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_pass http://127.0.0.1:3102;
}
location = /readyz {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Upgrade "";
    proxy_cache off;
    proxy_intercept_errors off;
    proxy_pass http://127.0.0.1:3102;
}
location ^~ /v1/ {
    if ($scheme = http) { return 308 https://$host$request_uri; }
    client_max_body_size 4m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header Connection "";
    proxy_set_header Upgrade "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    proxy_pass http://127.0.0.1:3102;
}
